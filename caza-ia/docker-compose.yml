# CAZA IA en local o en un servidor pequeño: PostgreSQL, Redis, migraciones, API (tablero y operador) y worker de vigilancia.
# Copia .env.example a .env y rellena al menos CAZA_API_TOKEN. Las compras siguen deshabilitadas salvo que lo cambies a propósito.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: caza
      POSTGRES_PASSWORD: caza
      POSTGRES_DB: caza
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caza -d caza"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redisdata:/data

  migrate:
    build: .
    command: ["bash", "scripts/migrate.sh"]
    environment:
      DATABASE_URL: postgres://caza:caza@postgres:5432/caza
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: ["npx", "tsx", "src/scripts/api-server.ts"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://caza:caza@postgres:5432/caza
      REDIS_URL: redis://redis:6379/0
      CAZA_API_PORT: "3080"
    ports:
      - "3080:3080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped

  worker:
    build: .
    command: ["npx", "tsx", "src/scripts/watch-worker.ts"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://caza:caza@postgres:5432/caza
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
